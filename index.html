<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="view-dashboard" class="dashboard">
        <header class="header-principal">
            <div>
                <h1>Overview</h1>
                <div style="position: relative; display: inline-block;">
                    <p id="display-data" class="data-hoje" style="margin-top: 2px;"></p>
                    <input type="date" id="input-data" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
                </div>
            </div>
            <div class="botoes-backup">
                <button id="btn-salvar-arquivo" class="btn-secundario" title="Save/update synced file">💾 Save file</button>
                <button id="btn-abrir-arquivo" class="btn-secundario" title="Open synced file">📂 Open file</button>
                <button id="btn-exportar" class="btn-secundario" title="Make local backup">🗄️ Backup</button>
                <button id="btn-importar" class="btn-secundario" title="Restore from backup">🔄 Restore</button>
                <input type="file" id="input-importar" accept=".json" style="display: none;">
            </div>
        </header>

        <section class="sessao-grade">
            <div class="grid-scroll">
                <div class="grid-365" id="grid-geral"></div>
            </div>
            <div class="legenda-grade">
                <span id="contador-geral" style="margin-right: auto; font-weight: 600; color: #000;">Overall Progress: 0 days</span>
                <span>Pending</span>
                <div class="quadrado-exemplo pendente"></div>
                <div class="quadrado-exemplo feito"></div>
                <span>Done</span>
            </div>
        </section>

        <section class="sessao-atividades">
            <h2>Today's Activities</h2>
            <div class="grid-atividades" id="lista-habitos"></div>
            <div class="area-adicionar">
                <button id="btn-add-habito" class="btn-novo">+ Add Habit</button>
                <div id="form-add-habito" class="form-oculto">
                    <input type="text" id="novo-nome-habito" placeholder="e.g. Read 20 mins">
                    <button id="btn-confirmar-add" class="btn-primario">Save</button>
                    <button id="btn-cancelar-add" class="btn-secundario">Cancel</button>
                </div>
            </div>
        </section>
    </main>

    <main id="view-detalhes" class="dashboard" style="display: none;">
        <header class="header-principal" style="align-items: center;">
            <div>
                <button class="btn-secundario" onclick="voltarParaDashboard()" style="margin-bottom: 10px; padding: 4px 10px;">⬅ Back</button>
                <h1 id="titulo-detalhe-atividade">Activity Name</h1>
            </div>
        </header>

        <section class="sessao-grade">
            <div class="filtros-painel">
                <select id="filtro-ano" class="select-minimalista">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                </select>
                <select id="filtro-modo" class="select-minimalista">
                    <option value="ano">Full Year</option>
                    <option value="mes">Current Month</option>
                    <option value="semana">Current Week</option>
                </select>
            </div>

            <div class="grid-scroll">
                <div class="grid-365" id="grid-detalhe"></div>
            </div>
            <div class="legenda-grade">
                <span id="contador-detalhe" style="margin-right: auto; font-weight: 600; color: #000;">Progress: 0 days</span>
            </div>
        </section>
    </main>

    <div id="modal-overlay" class="modal-overlay">
        <div id="modal-renomear" class="modal-box" style="display: none;">
            <h3>Rename Habit</h3>
            <input type="text" id="input-renomear" class="modal-input">
            <div class="modal-acoes">
                <button class="btn-secundario" onclick="fecharModais()">Cancel</button>
                <button id="btn-salvar-renomear" class="btn-primario">Save</button>
            </div>
        </div>
        <div id="modal-excluir" class="modal-box" style="display: none;">
            <h3>Delete Habit</h3>
            <p>History will be kept, but it will be removed from the current list.</p>
            <div class="modal-acoes">
                <button class="btn-secundario" onclick="fecharModais()">Cancel</button>
                <button id="btn-confirmar-excluir" class="btn-primario bg-vermelho">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
